<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="display">
    <div class="display"><h1>0</h1></div>
    </div>
    
    <div id="top">
        <div id="AC" class="shape"><h1>AC</h1></div>
        <div id="round_left" class="shape"><h1>(</h1></div>
        <div id="round_right" class="shape"><h1>)</h1></div>
        <div id="divide" class="shape"><h1>/</h1></div>
    </div>

    <div id="main">
        <div id="seven" class="shape"><h1>7</h1></div>
        <div id="eight" class="shape"><h1>8</h1></div>
        <div id="nine" class="shape"><h1>9</h1></div>
        <div id="multiply" class="shape"><h1>*</h1></div>
    </div>

    <div id="main">
        <div id="four" class="shape"><h1>4</h1></div>
        <div id="five" class="shape"><h1>5</h1></div>
        <div id="six" class="shape"><h1>6</h1></div>
        <div id="sub" class="shape"><h1>-</h1></div>
    </div>
    
    <div id="main">
        <div id="one" class="shape"><h1>1</h1></div>
        <div id="two" class="shape"><h1>2</h1></div>
        <div id="three" class="shape"><h1>3</h1></div>
        <div id="add" class="shape"><h1>+</h1></div>
    </div>

    <div id="main">
        <div id="zero" class="shape"><h1>0</h1></div>
        <div id="dot" class="shape"><h1>.</h1></div>
        <div id="equal" class="shape"><h1>=</h1></div>
        <div id="clear" class="shape"><h1>clc</h1></div>
    </div>
    
    <script src="cal.js"></script>
</body>
</html>
